name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build Next.js application
        run: npm run build
        env:
          MONGODB_URI: "mongodb://localhost:27017/test-portfolio"
          ADMIN_PASSWORD: "ci-dummy-password-for-build"
          ADMIN_SESSION_SECRET: "ci-dummy-secret-key-that-is-sufficiently-long-for-testing-12345"
          NEXT_PUBLIC_SITE_URL: "https://dawoodrana.com"
